[project]
name = "agentisizer"
version = "0.1.0"
description = "Hear what your agents are doing. A modular synthesiser for data streams, driven by Sonic Pi."
requires-python = ">=3.10"
dependencies = ["python-osc>=1.8.3", "rich>=13.7.0"]

[project.scripts]
agentisizer = "agentisizer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agentisizer", "agentisizer.sources"]
