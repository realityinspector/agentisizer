<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="The Agentisizer: a small synthesiser module whose knobs are eyes and whose oscilloscope is a smile">
  <defs>
    <linearGradient id="cableL" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="cableR" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2740"/><stop offset="1" stop-color="#131c2f"/>
    </linearGradient>
    <linearGradient id="knob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- patch cables, arcing out of the top like antennae: data coming in -->
  <path d="M78 62 C60 30 38 26 26 34" stroke="url(#cableL)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <circle cx="26" cy="34" r="8" fill="#22d3ee"/>
  <path d="M162 62 C180 30 202 26 214 34" stroke="url(#cableR)" stroke-width="7"
        fill="none" stroke-linecap="round"/>
  <circle cx="214" cy="34" r="8" fill="#f472b6"/>

  <!-- the module -->
  <rect x="30" y="56" width="180" height="158" rx="26" fill="url(#panel)"
        stroke="#33415c" stroke-width="3"/>
  <!-- rack screws, because it is a real module -->
  <circle cx="46" cy="72" r="3.5" fill="#3d4c6b"/>
  <circle cx="194" cy="72" r="3.5" fill="#3d4c6b"/>
  <circle cx="46" cy="198" r="3.5" fill="#3d4c6b"/>
  <circle cx="194" cy="198" r="3.5" fill="#3d4c6b"/>

  <!-- knobs, which are also eyes. The indicators point slightly inward, which
       is the whole difference between a control panel and a face. -->
  <g>
    <circle cx="90" cy="112" r="25" fill="url(#knob)" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="90" cy="112" r="15" fill="#0f1729"/>
    <circle cx="95" cy="107" r="4.5" fill="#e2e8f0"/>
    <path d="M90 92 L90 84" stroke="#4ade80" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g>
    <circle cx="150" cy="112" r="25" fill="url(#knob)" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="150" cy="112" r="15" fill="#0f1729"/>
    <circle cx="155" cy="107" r="4.5" fill="#e2e8f0"/>
    <path d="M150 92 L150 84" stroke="#4ade80" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- the scope: a smile drawn as a waveform, because that is what it is -->
  <rect x="66" y="152" width="108" height="42" rx="12" fill="#0b1220" stroke="#33415c" stroke-width="2.5"/>
  <path d="M80 166 C90 188 104 192 120 184 C136 176 150 180 160 166"
        stroke="#4ade80" stroke-width="5" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- patch jacks along the bottom edge: audio out -->
  <circle cx="86" cy="207" r="4" fill="#0b1220" stroke="#475569" stroke-width="2"/>
  <circle cx="120" cy="207" r="4" fill="#0b1220" stroke="#475569" stroke-width="2"/>
  <circle cx="154" cy="207" r="4" fill="#0b1220" stroke="#475569" stroke-width="2"/>
</svg>
