<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 352" width="880" height="352" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="ladder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#fbbf24"/>
      <stop offset="0.45" stop-color="#4ade80"/>
      <stop offset="0.75" stop-color="#38bdf8"/>
      <stop offset="1"    stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="880" height="352" rx="14" fill="#0d1117"/>

  <text x="28" y="38" fill="#e5e7eb" font-size="16" font-weight="700">Mood moves the key, not just the volume</text>
  <text x="28" y="60" fill="#94a3b8" font-size="12.5">Each step down the ladder flattens exactly one degree — the shift is felt without being announced.</text>

  <!-- the ladder -->
  <rect x="28" y="86" width="796" height="8" rx="4" fill="url(#ladder)"/>

  <g font-size="13" fill="#cbd5e1" text-anchor="middle">
    <text x="82"  y="122">lydian</text>
    <text x="212" y="122">ionian</text>
    <text x="352" y="122">mixolydian</text>
    <text x="490" y="122">dorian</text>
    <text x="628" y="122">aeolian</text>
    <text x="762" y="122">phrygian</text>
  </g>
  <g font-size="11" fill="#64748b" text-anchor="middle">
    <text x="82"  y="140">(unused)</text>
    <text x="352" y="140">♭7</text>
    <text x="490" y="140">♭3 ♭7</text>
    <text x="628" y="140">♭3 ♭6 ♭7</text>
    <text x="762" y="140">♭2 ♭3 ♭6 ♭7</text>
  </g>

  <text x="34"  y="80" fill="#fbbf24" font-size="11" font-weight="700">BRIGHTEST</text>
  <text x="824" y="80" fill="#a78bfa" font-size="11" font-weight="700" text-anchor="end">DARKEST</text>

  <!-- resting point -->
  <path d="M490 96 L490 108" stroke="#4ade80" stroke-width="2"/>
  <circle cx="490" cy="90" r="6" fill="#4ade80"/>
  <text x="490" y="170" fill="#4ade80" font-size="11.5" text-anchor="middle" font-weight="700">neutral rests here</text>

  <!-- travel arrows -->
  <path d="M450 190 L290 190" stroke="#4ade80" stroke-width="2" fill="none"/>
  <path d="M290 190 l9 -5 l0 10 z" fill="#4ade80"/>
  <text x="370" y="182" fill="#4ade80" font-size="12" text-anchor="middle">good news</text>

  <path d="M532 190 L730 190" stroke="#f87171" stroke-width="2" fill="none"/>
  <path d="M730 190 l-9 -5 l0 10 z" fill="#f87171"/>
  <text x="631" y="182" fill="#f87171" font-size="12" text-anchor="middle">trouble</text>

  <!-- measured payoff -->
  <rect x="28" y="212" width="796" height="112" rx="10" fill="#111c2e" stroke="#1f2f47"/>
  <text x="46" y="236" fill="#e5e7eb" font-size="13" font-weight="700">Measured, not just intended</text>
  <text x="46" y="258" fill="#94a3b8" font-size="12">Chroma analysis of a recorded mood sweep — the flat second's share of harmonic energy:</text>

  <text x="46"  y="288" fill="#94a3b8" font-size="12">A♯/B♭ (♭2)</text>
  <rect x="140" y="277" width="8"   height="14" rx="2" fill="#4ade80"/>
  <text x="158" y="288" fill="#4ade80" font-size="12">0.9% bright</text>

  <rect x="270" y="277" width="264" height="14" rx="2" fill="#a78bfa"/>
  <text x="546" y="288" fill="#a78bfa" font-size="12">52.8% dark</text>

  <text x="46" y="308" fill="#64748b" font-size="12">a 58× change in the note that defines the mode</text>
</svg>
